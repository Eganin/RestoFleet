name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Сборка, unit-тесты, detekt, архитектурные тесты и Kover-гейт (проект ≥ 80 %, domain/shared ≥ 90 %)
      - name: Build, test, detekt, Kover gate
        run: ./gradlew build detekt koverVerifyCi koverHtmlReportCi --continue

      - name: Upload Kover report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: build/reports/kover/htmlCi
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests'
          if-no-files-found: ignore
