# Эксперимент «MQTT vs REST-polling» (КМ4, ТЗ 13.2): REST 15 с, потери 5 % (tc netem)
# Запуск: tools/experiments/run-experiment.sh rest15-1000-loss5
name: rest15-1000-loss5
mode: rest
devices: 1000
seed: 42
rampPerSec: 100
warmupSec: 30
durationSec: 240
telemetryIntervalSec: 30
pollIntervalSec: 15
jitter: 0.05
mix: { kitchen: 2, hall: 3, assembly: 1 }
commands: { perMinute: 60, type: ping, ttlSec: 300 }
loss: { devices: 10, mode: silent, timeoutSec: 105 }
network: loss5
endpoints:
  api: http://backend-devices:8080
  control: http://backend-ctl:8080
  broker: { host: mosquitto, port: 8883 }
