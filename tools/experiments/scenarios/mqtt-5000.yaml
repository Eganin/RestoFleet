# Эксперимент «MQTT vs REST-polling» (КМ4, ТЗ 13.2): MQTT, N = 5000, телеметрия 30 с
# Запуск: tools/experiments/run-experiment.sh mqtt-5000
name: mqtt-5000
mode: mqtt
devices: 5000
seed: 42
rampPerSec: 100
warmupSec: 30
durationSec: 240
telemetryIntervalSec: 30
jitter: 0.05
mix: { kitchen: 2, hall: 3, assembly: 1 }
commands: { perMinute: 60, type: ping, ttlSec: 300 }
loss: { devices: 10, mode: silent, timeoutSec: 120 }
network: baseline
endpoints:
  api: http://backend-devices:8080
  control: http://backend-ctl:8080
  broker: { host: mosquitto, port: 8883 }
