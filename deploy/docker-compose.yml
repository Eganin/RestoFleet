# Стенд RestoFleet (MVP): Mosquitto 2.1 — TLS 8883 + Dynamic Security + persistence.
# Порядок запуска — deploy/README.md.
name: restofleet

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "8883:8883"
    # Брокеру монтируется только certs/out/broker (без ключа CA). Ключ сервера копируется внутрь
    # с владельцем mosquitto и правами 600, затем запускается штатный entrypoint образа.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -o mosquitto -g mosquitto -m 700 /mosquitto/certs &&
        install -o mosquitto -g mosquitto -m 644 /certs-src/ca.crt /certs-src/server.crt /mosquitto/certs/ &&
        install -o mosquitto -g mosquitto -m 600 /certs-src/server.key /mosquitto/certs/ &&
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs/out/broker:/certs-src:ro
      - mosquitto-data:/mosquitto/data
    # Брокер жив, если по TLS отвечает CONNACK «not authorised» анонимному клиенту: пароль админа не нужен
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -t health -C 1 -W 3 2>&1
          | grep -q 'not authorised'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Однократно: docker compose --profile init run --rm dynsec-init
  dynsec-init:
    image: eclipse-mosquitto:2.1.2-alpine
    profiles: ["init"]
    environment:
      DYNSEC_ADMIN_PASSWORD: ${DYNSEC_ADMIN_PASSWORD:?set it in deploy/.env}
    volumes:
      - ./mosquitto/init-dynsec.sh:/init-dynsec.sh:ro
      - mosquitto-data:/mosquitto/data
    entrypoint: ["/bin/sh", "/init-dynsec.sh"]

volumes:
  mosquitto-data:
