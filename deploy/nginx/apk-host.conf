# HTTPS-шлюз стенда (8443 на хосте): раздача APK (только GET/HEAD, только *.apk и *.sha256) и прокси REST API
# бэкенда — /api/, /health, /swagger → backend:8080 (реш. 211). TLS 1.2+, сертификат стенда.
# Заменяет conf.d/default.conf образа nginx; порта 80 нет.
server {
    listen 443 ssl;
    server_name localhost apk-host;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    autoindex off;
    root /srv/apk;

    # Свои типы вместо mime.types: всё, чего здесь нет, отдавалось бы как default_type
    types {
        application/vnd.android.package-archive apk;
        text/plain                              sha256;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;

    # Бэкенд резолвится при каждом запросе (DNS Docker): nginx стартует и раздаёт APK без бэкенда, API тогда — 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Только плоские имена без точки в начале; GET (и HEAD, его nginx разрешает вместе с GET)
    location ~ ^/[A-Za-z0-9][A-Za-z0-9._-]*\.(apk|sha256)$ {
        limit_except GET {
            deny all;
        }
    }

    # REST API. X-Forwarded-For ЗАМЕНЯЕТСЯ адресом клиента (не дописывается): по нему бэкенд считает rate limit
    # (реш. 249), подделанный клиентом заголовок до бэкенда не доходит. Тело — не больше 1 МБ, как у бэкенда.
    location /api/ {
        client_max_body_size 1m;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass $backend;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Swagger UI и спецификация (реш. 212): /swagger и /swagger/documentation.yaml
    location /swagger {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Всё остальное — 404 (в том числе листинг каталога и любые другие расширения)
    location / {
        return 404;
    }
}
