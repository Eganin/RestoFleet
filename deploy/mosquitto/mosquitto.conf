# Mosquitto 2.1 стенда RestoFleet: только TLS 8883, без анонимов, Dynamic Security, persistence.
per_listener_settings false
allow_anonymous false

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_keepalive 120

# R-1 (реш. 302): пакет больше 260 КиБ брокер не принимает и отключает отправителя. Это предел декодера бэкенда
# (payload до 256 КиБ) плюс 4 КиБ на заголовки; бэкенд объявляет тот же Maximum Packet Size (MqttConfig).
max_packet_size 266240

# R-2 (реш. 303): очередь QoS 1/2 на клиента сверх сообщений в полёте. Умолчание Mosquitto — 1 000 сообщений, сверх
# него сообщения для сессии бэкенда молча выбрасывались, хотя устройство уже получило PUBACK. 200 000 сообщений
# ≈ 40 мин недоступности бэкенда или БД при 5 000 устройств и 1 сообщении QoS 1 в минуту на устройство; 128 МиБ
# payload — предохранитель по памяти на клиента. QoS 0 (живая телеметрия и пробы) для отключённой сессии не копится
# (queue_qos0_messages false по умолчанию).
max_queued_messages 200000
max_queued_bytes 134217728
# Общий предел кучи брокера (1 ГиБ из 7,65 ГиБ ВМ стенда). По документации Mosquitto сверх него входящее сообщение
# отклоняется, а отправитель отключается (без PUBACK запись остаётся в outbox агента); исходящее отбрасывается,
# а получатель отключается. Это аварийная граница: очереди выше рассчитаны так, чтобы до неё не доходить.
memory_limit 1073741824

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
