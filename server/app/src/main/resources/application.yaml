# Конфигурация бэкенда по умолчанию — стенд в docker compose (deploy/docker-compose.yml).
# Переопределение: переменные RF_<РАЗДЕЛ>_<КЛЮЧ> (RF_MQTT_HOST, RF_RATELIMIT_PROVISIONPERMINUTE…) или файл RF_CONFIG.
# Секретов здесь нет: только пути к файлам (Docker secrets, deploy/out/… с правами 600).
http:
  host: 0.0.0.0
  port: 8080
  maxBodyBytes: 1048576
database:
  jdbcUrl: jdbc:postgresql://postgres:5432/restofleet
  user: restofleet
  passwordFile: /run/secrets/postgres-password
  maxPoolSize: 10
mqtt:
  host: mosquitto
  port: 8883
  username: backend
  clientId: backend
  passwordFile: /run/secrets/backend-mqtt-password
  caFile: /certs/ca.crt
jwt:
  secretFile: /run/secrets/jwt-secret
  issuer: restofleet
  audience: restofleet-api
  accessTtlMinutes: 15
provisioning:
  brokerHost: 10.0.2.2
  brokerPort: 8883
  tokenTtlHours: 24
polling:
  staleAfterMs: 90000
# Сессии (реш. 417): refresh — 24 ч простоя, не дольше 7 сут со входа; повтор только что ротированного токена
# прощается 60 с, пока преемник не использован (потерянный ответ, реш. 531)
auth:
  refreshIdleHours: 24
  sessionMaxDays: 7
  reuseGraceSec: 60
# Пороги, которые проверяет бэкенд (реш. 415): R-06 — свободно < 500 МБ, закрытие от 600 МБ
alerts:
  freeMbEnter: 500
  freeMbExit: 600
# Умолчания desired по ролям (реш. 425). Адреса — стенд: из эмулятора 10.0.2.2, через Toxiproxy (api 18443,
# ref 18444, kds 18445 → nginx стенда). Реальные цели и package name подставляются здесь или переменными
# RF_DESIRED_<РОЛЬ>_…, код не меняется.
desired:
  kitchen:
    watchedApps: [com.android.chrome]
    probes:
      - { id: api, url: "https://10.0.2.2:18443/health", intervalSec: 30, failThreshold: 3 }
      - { id: kds, url: "https://10.0.2.2:18445/kds", intervalSec: 60, failThreshold: 3, expectedStatus: 204 }
      - { id: ref, url: "https://10.0.2.2:18444/ref", intervalSec: 60, failThreshold: 3, reference: true, expectedStatus: 204 }
  hall:
    # [[ДАННЫЕ ПРЕДПРИЯТИЯ: package name приложения официанта]] — пример: тестовое приложение стенда
    watchedApps: [ru.restofleet.dummy.waiter]
    probes:
      - { id: api, url: "https://10.0.2.2:18443/health", intervalSec: 30, failThreshold: 3 }
      - { id: ref, url: "https://10.0.2.2:18444/ref", intervalSec: 60, failThreshold: 3, reference: true, expectedStatus: 204 }
  assembly:
    # [[ДАННЫЕ ПРЕДПРИЯТИЯ: package name приложения сборщика]] — пример
    watchedApps: [ru.restofleet.dummy.assembly]
    probes:
      - { id: api, url: "https://10.0.2.2:18443/health", intervalSec: 30, failThreshold: 3 }
      - { id: ref, url: "https://10.0.2.2:18444/ref", intervalSec: 60, failThreshold: 3, reference: true, expectedStatus: 204 }
# Классификатор инцидентов (реш. 409–412): P = 50 %, M = max(3, ⌈0,25·N⌉), окно 2 мин, тик 30 с
incidents:
  backendDownPct: 50
  minRestaurants: 3
  restaurantSharePct: 25
  offlinePct: 50
  primaryTarget: api
  refTarget: ref
  windowSec: 120
  silentAfterHours: 24
  resolveAfterTicks: 2
  tickMs: 30000
rateLimit:
  loginPerMinute: 10
  provisionPerMinute: 60
  pollAuthFailuresPerMinute: 60
jobs:
  expireCommandsMs: 5000
  markStalePollersMs: 5000
  metricsLogMs: 60000
secretsDir: /run/secrets
