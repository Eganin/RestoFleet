openapi: 3.0.3
info:
  title: RestoFleet backend API
  version: "1.1.0-practice"
  description: |
    REST API бэкенда RestoFleet (этапы «курсовая» и «практика», ТЗ 8.2). Рукописная спецификация (реш. 212): тест
    `OpenApiSpecTest` сверяет, что каждый маршрут Ktor описан здесь, а `docs/openapi.yaml` — копия этого файла.
    Контракт консоли зафиксирован в ПМ1 практики (реш. 408): DTO — `shared:protocol`, пакет `rest.console`,
    `ConsoleContractTest` сверяет схемы с ними. Операции с `x-planned: true` ещё не реализованы — пометку снимает
    задача, которая добавляет маршрут.

    * Консоль и Swagger: `POST /api/v1/auth/login` → `accessToken` (JWT, 15 мин) в кнопке **Authorize** (`bearerAuth`).
    * Агент и симулятор: `POST /api/v1/provision` (без JWT) по одноразовому коду; REST-polling — HTTP Basic
      `deviceId:password` (`deviceBasic`).
    * Время — epoch ms (UTC). Ошибки — `{code, message, field?, reason?}`.
    * Реальное время консоли — WebSocket `GET /api/v1/ws` (конверт `{v, type, ts, data}`, схема `WsEnvelope`).
    * Стенд: `https://localhost:8443` (nginx стенда, CA `deploy/certs/out/public/ca.crt`), из эмулятора —
      `https://10.0.2.2:8443`.
servers:
  - url: /
tags:
  - name: auth
  - name: restaurants
  - name: devices
  - name: shadow
  - name: commands
  - name: provisioning
  - name: alerts
  - name: incidents
  - name: realtime
  - name: polling
  - name: health
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [health]
      summary: Состояние бэкенда (БД и брокер)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Healthy" }
        "503": { $ref: "#/components/responses/Degraded" }
  /api/v1/health:
    get:
      tags: [health]
      summary: То же, что /health, под префиксом API
      security: []
      responses:
        "200": { $ref: "#/components/responses/Healthy" }
        "503": { $ref: "#/components/responses/Degraded" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход (rate limit по IP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Пара токенов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Ротация refresh-токена (одноразовый; повтор погашенного отзывает все сессии пользователя)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: |
            Новая пара токенов. Срок refresh — `min(now + 24 ч, вход + 7 сут)`, семейство наследуется (реш. 417).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      x-planned: true
      summary: Выход — отзыв семейства refresh-токенов сессии (реш. 417)
      description: JWT не нужен (access мог истечь). Ответ всегда 204, даже для неизвестного или погашенного токена.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "204": { description: Сессия завершена (или уже не существовала) }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/summary:
    get:
      tags: [alerts]
      summary: Сводка для экрана «Обзор» (FR-CN-02); те же данные приходят по WS `summary_changed`
      responses:
        "200":
          description: Счётчики и рестораны с проблемами
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/restaurants:
    get:
      tags: [restaurants]
      summary: Все рестораны (по коду)
      responses:
        "200":
          description: Рестораны
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Restaurant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [restaurants]
      summary: Новый ресторан
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRestaurantRequest" }
      responses:
        "201":
          description: Создан
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/restaurants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [restaurants]
      summary: Карточка ресторана
      responses:
        "200":
          description: Ресторан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [restaurants]
      summary: Частичное изменение (отсутствующее поле не меняется)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRestaurantRequest" }
      responses:
        "200":
          description: Изменён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/devices:
    get:
      tags: [devices]
      summary: Список устройств
      parameters:
        - { name: restaurant, in: query, schema: { type: string, format: uuid } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/DeviceRole" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeviceStatus" } }
        - name: q
          in: query
          description: Поиск без учёта регистра по имени устройства, коду и названию ресторана, модели (`%` и `_` — буквально)
          schema: { type: string, maxLength: 100 }
        - name: version
          in: query
          description: Точная версия агента (`agentVersion`, реш. 424)
          schema: { type: string, maxLength: 64 }
        - name: problems
          in: query
          description: true — только устройства с открытой или подтверждённой неподавленной тревогой
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: |
            Устройства (по времени регистрации) с полями консоли: `restaurantCode`, `restaurantName`, `lastTelemetry`,
            `lastSessionReason`, `alerts`.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    get:
      tags: [devices]
      summary: Карточка устройства (реестр, последняя телеметрия, последняя MQTT-сессия)
      responses:
        "200":
          description: Устройство
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [devices]
      summary: Вывод из эксплуатации (учётка DynSec отключается, сессия рвётся, незавершённые команды — failed/decommissioned, retained очищаются; запись остаётся)
      responses:
        "200":
          description: Выведено (повторный вызов идемпотентен и дочищает retained)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decommission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/devices/{id}/telemetry:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    get:
      tags: [devices]
      summary: История телеметрии, новые сначала
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: metric
          in: query
          description: Поля через запятую (batteryLevel, charging, tempC, thermal, rssi, freeMb, availMb, foregroundApp)
          schema: { type: string, example: "batteryLevel,tempC" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Точки
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TelemetryPoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{id}/probes:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    get:
      tags: [devices]
      summary: История проверок доступности, новые сначала
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: target, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Результаты
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProbeRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{id}/events:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    get:
      tags: [devices]
      summary: События устройства, новые сначала
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: type, in: query, schema: { type: string, example: probe_state } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: События
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EventRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{id}/shadow:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    get:
      tags: [shadow]
      summary: Тень (desired, reported, delta)
      responses:
        "200":
          description: Тень
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shadow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [shadow]
      summary: Изменение desired — merge-patch (объекты сливаются, списки и значения заменяются)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example: { telemetry: { intervalSec: 60 } }
      responses:
        "200":
          description: Тень после изменения; published = false — брокер не принял retained, повтор при подключении
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shadow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /api/v1/devices/{id}/commands:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    post:
      tags: [commands]
      summary: Команда устройству (queued → cmd/req; офлайн-устройству — при подключении)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCommandRequest" }
      responses:
        "201":
          description: Принята
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [commands]
      summary: История команд устройства, новые сначала (FR-CN-07)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Команды
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Command" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/commands/{cmdId}:
    get:
      tags: [commands]
      summary: Команда и её статус
      parameters:
        - { name: cmdId, in: path, required: true, schema: { type: string, example: c-0b1f… } }
      responses:
        "200":
          description: Команда
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts:
    get:
      tags: [alerts]
      summary: Тревоги R-01…R-06 (FR-BE-30, 31), новые сначала
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/AlertState" } }
        - { name: restaurant, in: query, schema: { type: string, format: uuid } }
        - { name: device, in: query, schema: { type: string } }
        - { name: rule, in: query, schema: { type: string, enum: [R-01, R-02, R-03, R-04, R-05, R-06] } }
        - name: includeSuppressed
          in: query
          description: true — включить тревоги, покрытые инцидентом (`parentIncidentId`, реш. 416)
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Тревоги
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/alerts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [alerts]
      summary: Подтвердить или закрыть тревогу (закрытие — с комментарием 1…500)
      description: |
        Автор — `login` из JWT (реш. 446). Повтор над подтверждённой — 409 `conflict` (`reason` = `already_acknowledged`),
        над закрытой — 409 (`already_resolved`). Неизвестное `action` или комментарий вне 1…500 — 400 `validation`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertAction" }
      responses:
        "200":
          description: Тревога после действия
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/incidents:
    get:
      tags: [incidents]
      x-planned: true
      summary: Сводные инциденты доступности R-07…R-09 (FR-BE-36, 37), новые сначала
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, resolved] } }
        - name: from
          in: query
          description: "Интервал инцидента `[startedAt, resolvedAt ?: now)` пересекается с `[from, to)`; epoch ms или ISO-8601"
          schema: { type: string }
        - { name: to, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Инциденты
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/incidents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [incidents]
      x-planned: true
      summary: Инцидент и доказательства классификации (текст объяснения строит консоль)
      responses:
        "200":
          description: Инцидент
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [incidents]
      x-planned: true
      summary: Подтвердить инцидент с комментарием (закрывается только автоматически, реш. 412)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentAction" }
      responses:
        "200":
          description: Инцидент после подтверждения
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/ws:
    get:
      tags: [realtime]
      x-planned: true
      summary: WebSocket обновлений консоли (FR-BE-33, 51; реш. 418, 419)
      description: |
        Upgrade до WebSocket. Токен — **только** заголовок `Authorization: Bearer <access>` upgrade-запроса;
        параметр `?token=` и любые query игнорируются (без заголовка — 401). Фреймы — текст JSON, конверт
        `WsEnvelope`; первым приходит `hello`.

        * Всем соединениям: `device_status`, `alert`, `incident`, `summary_changed` (не чаще раза в 2 с).
        * `telemetry` — только устройств из `subscribe_device` (не больше 5); `unsubscribe_device` — отписка.
        * После каждого подключения клиент перечитывает состояние через REST; `resync` — сделать это без
          переподключения.
        * Ping каждые 20 с, таймаут 30 с, фрейм ≤ 64 КиБ, не больше 4 соединений на пользователя, очередь — 256.

        Коды закрытия:
        * `1001` — сервер останавливается: переподключиться с backoff;
        * `1008` — нарушение политики (пятое соединение, шестая подписка, неразборчивый фрейм): не переподключаться
          сразу;
        * `1013` — очередь соединения переполнена: переподключиться и перечитать состояние через REST;
        * `4401` — истёк `exp` access-токена: refresh и переподключение.
      parameters:
        - { name: Upgrade, in: header, required: true, schema: { type: string, enum: [websocket] } }
        - { name: Connection, in: header, required: true, schema: { type: string, example: Upgrade } }
      responses:
        "101": { description: Переход на WebSocket; сообщения — `WsEnvelope` }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/provisioning/tokens:
    post:
      tags: [provisioning]
      summary: Одноразовый код регистрации (TTL 24 ч; код показывается один раз)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueTokenRequest" }
      responses:
        "201":
          description: Код
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  "/api/v1/provisioning/tokens:batch":
    post:
      tags: [provisioning]
      summary: Пакет кодов 1…1000 (симулятор)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueTokensBatchRequest" }
      responses:
        "201":
          description: Коды
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IssuedToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/provision:
    post:
      tags: [provisioning]
      summary: Обмен кода на учётку устройства (агент, без JWT, rate limit по IP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionRequest" }
      responses:
        "201":
          description: Учётка (пароль — один раз); адрес брокера для устройства
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "token_invalid — код неизвестен", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "token_used — код уже погашен", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: "token_expired — срок кода истёк", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/poll/telemetry:
    post:
      tags: [polling]
      summary: REST-режим эксперимента — телеметрия, пробы и события одним запросом (отмечает присутствие)
      security:
        - deviceBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollTelemetryRequest" }
      responses:
        "204": { description: Записано }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/v1/poll/commands:
    get:
      tags: [polling]
      summary: Команды устройства в статусе queued (выдаются один раз и помечаются delivered)
      security:
        - deviceBasic: []
      responses:
        "200":
          description: Команды в формате cmd/req
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollCommandsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/poll/commands/result:
    post:
      tags: [polling]
      summary: Результат команды (тело = MQTT cmd/res; идемпотентно по cmdId и status)
      security:
        - deviceBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandResult" }
      responses:
        "204": { description: Принято (или повтор) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceBasic:
      type: http
      scheme: basic
      description: deviceId и пароль из ответа /provision
  parameters:
    DeviceIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, example: d-0b1f… }
    From:
      name: from
      in: query
      description: Начало интервала включительно — epoch ms или ISO-8601
      schema: { type: string, example: "2026-11-11T00:00:00Z" }
    To:
      name: to
      in: query
      description: Конец интервала, не включается — epoch ms или ISO-8601
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Healthy:
      description: Все компоненты доступны
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
    Degraded:
      description: БД или брокер недоступны
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
    BadRequest:
      description: "bad_request, validation (field, reason), invalid_payload (reason)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Нет или неверные учётные данные
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Конфликт с текущим состоянием (`reason` — причина)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: Устройство выведено из эксплуатации
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Тело больше 1 МБ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Превышен rate limit (заголовок Retry-After)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Брокер или БД недоступны
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation }
        message: { type: string }
        field: { type: string, example: telemetry.intervalSec }
        reason: { type: string, example: out_of_range }
    Health:
      type: object
      required: [status, components]
      properties:
        status: { type: string, enum: [ok, degraded] }
        components:
          type: object
          additionalProperties: { type: boolean }
          example: { database: true, broker: true }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, example: admin }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, accessExpiresAt, refreshToken, refreshExpiresAt, tokenType]
      properties:
        accessToken: { type: string }
        accessExpiresAt: { type: integer, format: int64 }
        refreshToken: { type: string }
        refreshExpiresAt: { type: integer, format: int64 }
        tokenType: { type: string, example: Bearer }
    Restaurant:
      type: object
      required: [id, code, name, city, address, timezone, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: MSK-01 }
        name: { type: string }
        city: { type: string }
        address: { type: string }
        timezone: { type: string, example: Europe/Moscow }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    RestaurantRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: MSK-01 }
        name: { type: string }
    CreateRestaurantRequest:
      type: object
      required: [code, name, city, timezone]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
        name: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 200, default: "" }
        timezone: { type: string, description: IANA-зона }
    UpdateRestaurantRequest:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        city: { type: string }
        address: { type: string }
        timezone: { type: string }
    DeviceRole:
      type: string
      enum: [kitchen, hall, assembly]
    DeviceStatus:
      type: string
      enum: [provisioned, online, offline, decommissioned]
    DeviceInfo:
      type: object
      required: [model, manufacturer, osVersion, apiLevel]
      properties:
        model: { type: string, maxLength: 100 }
        manufacturer: { type: string, maxLength: 100 }
        osVersion: { type: string, maxLength: 32 }
        apiLevel: { type: integer }
    Device:
      type: object
      required: [id, restaurantId, role, status, createdAt]
      properties:
        id: { type: string }
        restaurantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/DeviceRole" }
        name: { type: string }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        transport: { type: string, enum: [mqtt, poll] }
        lastSeenAt: { type: integer, format: int64 }
        decommissionedAt: { type: integer, format: int64 }
        createdAt: { type: integer, format: int64 }
        agentVersion: { type: string }
        mode: { type: string, enum: [normal, device_owner] }
        deviceInfo: { $ref: "#/components/schemas/DeviceInfo" }
        restaurantCode: { type: string }
        restaurantName: { type: string }
        lastTelemetry:
          allOf: [{ $ref: "#/components/schemas/TelemetryPoint" }]
          description: Последняя точка — только в `GET /devices`
        lastSessionReason: { type: string, example: lwt, description: "Причина закрытия последней сессии офлайн-устройства" }
        alerts:
          type: array
          description: Открытые и подтверждённые неподавленные тревоги — сначала критичные, затем новые
          items: { $ref: "#/components/schemas/Alert" }
    TelemetryPoint:
      type: object
      required: [ts, seq]
      properties:
        ts: { type: integer, format: int64 }
        seq: { type: integer, format: int64 }
        batteryLevel: { type: integer }
        charging: { type: boolean }
        tempC: { type: number }
        thermal: { type: string }
        rssi: { type: integer }
        freeMb: { type: integer, format: int64 }
        availMb: { type: integer, format: int64 }
        foregroundApp: { type: string }
    Session:
      type: object
      required: [connId, connectedAt]
      properties:
        connId: { type: string }
        connectedAt: { type: integer, format: int64 }
        disconnectedAt: { type: integer, format: int64 }
        reason: { type: string, example: lwt }
    DeviceDetails:
      type: object
      required: [device]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        lastTelemetry: { $ref: "#/components/schemas/TelemetryPoint" }
        lastSession: { $ref: "#/components/schemas/Session" }
    Decommission:
      type: object
      required: [device, retainedCleared]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        retainedCleared: { type: boolean }
    ProbeRecord:
      type: object
      required: [ts, target, ok, totalMs]
      properties:
        ts: { type: integer, format: int64 }
        target: { type: string }
        ok: { type: boolean }
        status: { type: integer }
        error: { type: string, example: timeout }
        totalMs: { type: integer, format: int64 }
        dnsMs: { type: integer, format: int64 }
        connectMs: { type: integer, format: int64 }
        tlsMs: { type: integer, format: int64 }
        ttfbMs: { type: integer, format: int64 }
    EventRecord:
      type: object
      required: [ts, type, payload]
      properties:
        ts: { type: integer, format: int64 }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
    Shadow:
      type: object
      required: [deviceId, desired, desiredVersion, desiredUpdatedAt, errors, delta, pending]
      properties:
        deviceId: { type: string }
        desired: { type: object, additionalProperties: true }
        desiredVersion: { type: integer, format: int64 }
        desiredUpdatedAt: { type: integer, format: int64 }
        reported: { type: object, additionalProperties: true }
        reportedVersion: { type: integer, format: int64 }
        appliedAt: { type: integer, format: int64 }
        reportedAt: { type: integer, format: int64 }
        errors: { type: array, items: { type: string } }
        delta: { type: object, additionalProperties: true, description: "Пустой объект — тень применена" }
        pending: { type: boolean }
        published: { type: boolean, description: Только в ответе на PUT }
    SendCommandRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          example: ping
          description: ping, reboot, beep, show_message, launch_app, lock_task, run_probe, collect_diagnostics
        params: { type: object, additionalProperties: true, default: {} }
        ttlSec: { type: integer, minimum: 1, maximum: 86400, default: 300 }
    Command:
      type: object
      required: [cmdId, deviceId, type, params, status, createdAt, expiresAt]
      properties:
        cmdId: { type: string }
        deviceId: { type: string }
        type: { type: string }
        params: { type: object, additionalProperties: true }
        status: { type: string, enum: [queued, delivered, succeeded, failed, unsupported, expired] }
        createdAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        deliveredAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
        result: { type: object, additionalProperties: { type: string } }
        reason: { type: string }
    IssueTokenRequest:
      type: object
      required: [restaurantId, role]
      properties:
        restaurantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/DeviceRole" }
        name: { type: string, maxLength: 100 }
    IssueTokensBatchRequest:
      type: object
      required: [restaurantId, role, count]
      properties:
        restaurantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/DeviceRole" }
        name: { type: string, maxLength: 100 }
        count: { type: integer, minimum: 1, maximum: 1000 }
    IssuedToken:
      type: object
      required: [id, code, restaurantId, role, expiresAt]
      properties:
        id: { type: string }
        code: { type: string, description: "26 символов base32 Крокфорда; регистр, пробелы и дефисы не важны" }
        restaurantId: { type: string }
        role: { $ref: "#/components/schemas/DeviceRole" }
        name: { type: string }
        expiresAt: { type: integer, format: int64 }
    ProvisionRequest:
      type: object
      required: [code, deviceInfo, agentVersion]
      properties:
        code: { type: string }
        deviceInfo: { $ref: "#/components/schemas/DeviceInfo" }
        agentVersion: { type: string, maxLength: 64 }
    ProvisionResponse:
      type: object
      required: [deviceId, password, restaurantId, role, mqtt]
      properties:
        deviceId: { type: string, description: "MQTT clientId и username" }
        password: { type: string, format: password }
        restaurantId: { type: string }
        role: { $ref: "#/components/schemas/DeviceRole" }
        mqtt:
          type: object
          required: [host, port]
          properties:
            host: { type: string, example: 10.0.2.2 }
            port: { type: integer, example: 8883 }
    AlertState:
      type: string
      enum: [open, acknowledged, resolved]
    Alert:
      type: object
      required: [id, ruleId, severity, state, deviceId, restaurantId, restaurantCode, restaurantName, openedAt, auto, details]
      properties:
        id: { type: string }
        ruleId: { type: string, enum: [R-01, R-02, R-03, R-04, R-05, R-06] }
        severity: { type: string, enum: [critical, warning] }
        state: { $ref: "#/components/schemas/AlertState" }
        deviceId: { type: string }
        deviceName: { type: string }
        restaurantId: { type: string, format: uuid }
        restaurantCode: { type: string }
        restaurantName: { type: string }
        target: { type: string, description: "Цель проверки у R-05 (api, kds, ref)" }
        openedAt: { type: integer, format: int64 }
        ackBy: { type: string, description: "login пользователя из JWT (реш. 446)" }
        ackAt: { type: integer, format: int64 }
        resolvedAt: { type: integer, format: int64 }
        resolvedBy: { type: string, description: "login пользователя; у автоматически закрытых нет" }
        comment: { type: string, maxLength: 500 }
        auto: { type: boolean, description: "Закрыта автоматически по выходу из условия" }
        parentIncidentId: { type: string, description: "Покрыта инцидентом (реш. 416)" }
        details:
          type: object
          additionalProperties: { type: string }
          description: |
            Значения условия строками. R-01 `reason`; R-02 `batteryLevel`, `limit`; R-03 `tempC`, `thermal`, `limit`;
            R-04 `pkg`, `foregroundApp`, `sinceTs`, `limitMin`; R-05 `error`, `failures`; R-06 `freeMb`, `limit`.
          example: { error: timeout, failures: "3" }
    AlertAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [acknowledge, resolve] }
        comment: { type: string, minLength: 1, maxLength: 500, description: "Обязателен для resolve" }
    Incident:
      type: object
      required: [id, kind, ruleId, state, target, restaurants, startedAt, suppressedAlerts]
      properties:
        id: { type: string }
        kind: { type: string, enum: [restaurant_network, backend_global, backend_local] }
        ruleId: { type: string, enum: [R-07, R-08, R-09] }
        state: { type: string, enum: [open, resolved] }
        target: { type: string, example: api }
        restaurants: { type: array, items: { $ref: "#/components/schemas/RestaurantRef" } }
        startedAt: { type: integer, format: int64 }
        resolvedAt: { type: integer, format: int64 }
        resolveReason: { type: string, enum: [cleared, superseded] }
        suppressedAlerts: { type: integer }
        ackBy: { type: string }
        ackAt: { type: integer, format: int64 }
        comment: { type: string, maxLength: 500 }
    IncidentAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [acknowledge] }
        comment: { type: string, maxLength: 500 }
    IncidentDetails:
      type: object
      required: [incident, evidence]
      properties:
        incident: { $ref: "#/components/schemas/Incident" }
        evidence: { $ref: "#/components/schemas/IncidentEvidence" }
    IncidentEvidence:
      type: object
      required: [evaluatedAt, restaurants, otherRestaurantsOk, thresholds]
      properties:
        evaluatedAt: { type: integer, format: int64 }
        restaurants: { type: array, items: { $ref: "#/components/schemas/RestaurantEvidence" } }
        otherRestaurantsOk: { type: integer, description: "Рестораны со свежими данными по цели, где она доступна" }
        thresholds: { $ref: "#/components/schemas/IncidentThresholds" }
    RestaurantEvidence:
      type: object
      required: [id, code, name, devicesTotal, devicesOnline, targetOnline, targetDown, refOnline, refUp, errorClasses]
      description: |
        Окно агрегатора (2 мин). devicesTotal — учитываемые устройства (без выведенных и молчащих > 24 ч);
        targetOnline и refOnline — онлайн-устройства со свежими данными по цели и по `ref`.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        devicesTotal: { type: integer }
        devicesOnline: { type: integer }
        targetOnline: { type: integer }
        targetDown: { type: integer }
        refOnline: { type: integer }
        refUp: { type: integer }
        errorClasses:
          type: object
          additionalProperties: { type: integer }
          example: { timeout: 9, dns_fail: 2 }
    IncidentThresholds:
      type: object
      required: [p, m, n]
      properties:
        p: { type: integer, description: "Порог P, % онлайн-устройств ресторана (реш. 409)" }
        m: { type: integer, description: "Порог M = max(3, ⌈0,25·n⌉)" }
        n: { type: integer, description: "Ресторанов со свежими данными по цели" }
    Summary:
      type: object
      required: [devicesOnline, devicesTotal, devicesOffline, offlineLastHour, alertsOpen, alertsCritical, incidentsOpen, restaurantsWithProblems, restaurantsTotal, problemRestaurants]
      properties:
        devicesOnline: { type: integer }
        devicesTotal: { type: integer, description: "Без выведенных из эксплуатации" }
        devicesOffline: { type: integer }
        offlineLastHour: { type: integer }
        alertsOpen: { type: integer, description: "Открытые и подтверждённые, без подавленных" }
        alertsCritical: { type: integer }
        incidentsOpen: { type: integer }
        restaurantsWithProblems: { type: integer }
        restaurantsTotal: { type: integer }
        problemRestaurants: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/ProblemRestaurant" } }
    ProblemRestaurant:
      type: object
      required: [restaurant, ruleId, count, devicesTotal, since, details]
      properties:
        restaurant: { $ref: "#/components/schemas/RestaurantRef" }
        ruleId: { type: string, example: R-05 }
        count: { type: integer, description: "Затронуто устройств" }
        devicesTotal: { type: integer }
        target: { type: string }
        deviceId: { type: string, description: "При count = 1" }
        deviceName: { type: string }
        since: { type: integer, format: int64 }
        details: { type: object, additionalProperties: { type: string } }
    WsEnvelope:
      type: object
      required: [v, type, data]
      description: |
        Фрейм WebSocket. Сервер: `ts` обязателен; `data` по типу — `hello` WsHello, `device_status` WsDeviceStatus,
        `telemetry` WsTelemetry, `alert` Alert, `incident` Incident, `summary_changed` Summary, `resync` WsResync.
        Клиент: без `ts`; `subscribe_device` и `unsubscribe_device` — WsDeviceRef. Неизвестный `type` или `v` ≠ 1
        получатель пропускает.
      properties:
        v: { type: integer, enum: [1] }
        type:
          type: string
          enum: [hello, device_status, telemetry, alert, incident, summary_changed, resync, subscribe_device, unsubscribe_device]
        ts: { type: integer, format: int64 }
        data: { type: object, additionalProperties: true }
    WsHello:
      type: object
      required: [connectionId, user, accessExpiresAt, maxSubscriptions]
      properties:
        connectionId: { type: string }
        user: { type: string }
        accessExpiresAt: { type: integer, format: int64, description: "В этот момент сервер закроет соединение кодом 4401" }
        maxSubscriptions: { type: integer, example: 5 }
    WsDeviceStatus:
      type: object
      required: [deviceId, restaurantId, status]
      properties:
        deviceId: { type: string }
        restaurantId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        lastSeenAt: { type: integer, format: int64 }
        reason: { type: string, example: lwt }
    WsTelemetry:
      type: object
      required: [deviceId, point]
      properties:
        deviceId: { type: string }
        point: { $ref: "#/components/schemas/TelemetryPoint" }
    WsResync:
      type: object
      required: [reason]
      properties:
        reason: { type: string, example: events_dropped }
    WsDeviceRef:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string }
    PollTelemetryRequest:
      type: object
      required: [telemetry]
      description: Части — сообщения MQTT telemetry, probe и events (ТЗ 7.2) того же формата
      properties:
        telemetry: { type: object, additionalProperties: true }
        probe: { type: object, additionalProperties: true }
        events: { type: array, items: { type: object, additionalProperties: true } }
    PollCommandsResponse:
      type: object
      required: [commands]
      properties:
        commands:
