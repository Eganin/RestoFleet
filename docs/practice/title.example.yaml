# Реквизиты титульного листа отчёта по практике для tools/practice/build_report.py (решения 403, 322).
#
# Скопируйте файл в title.local.yaml рядом с ним и впишите свои данные:
#   cp docs/practice/title.example.yaml docs/practice/title.local.yaml
# title.local.yaml — в .gitignore: репозиторий публичный, персональные данные в него не попадают.
# Без title.local.yaml генератор ставит заглушки в квадратных скобках. Другой файл — ключ --title.
#
# Поля и правила — те же, что у курсовой (tools/coursework/title.example.yaml): все поля необязательны,
# пустая строка "" убирает строку титула у ministry, university, institute, department; строку под видом
# работы — если пусты оба discipline_label и discipline; неизвестное поле — ошибка сборки.
# Вид работы («ОТЧЁТ») и тему задают ключи --work-type и --topic, по умолчанию — индивидуальное задание ТЗ 16.4.
# Генератор не знает полей «место прохождения практики» и «руководитель от предприятия»: место указано
# во введении, а второго руководителя при необходимости можно дописать в supervisor через «; ».

ministry: "[Наименование министерства]"
university: "[Наименование вуза]"
institute: "[Институт/факультет]"
department: "[Кафедра]"
# строка под словом «ОТЧЁТ»; вид практики — по приказу (производственная, преддипломная)
discipline_label: "по производственной (преддипломной) практике"
discipline: ""
# строки «Студент: <student>, группа <group>» и «Руководитель: <supervisor>»
student: "[ФИО студента]"
group: "[группа]"
supervisor: "[ФИО, должность]"
# нижняя строка «<city> <year>»
city: "[Город]"
year: "2026"
